<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 背景：奶油纸 + 噪点 -->
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.15 0 0 0 0 0.12 0 0 0 0 0.08 0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1A1614"/>
  <rect width="512" height="512" rx="96" filter="url(#paper)" opacity="0.4"/>
  <!-- 大写 E：复古衬线，柿橙描边 -->
  <text x="256" y="368" font-family="Fraunces,Georgia,serif" font-size="320" font-weight="900" text-anchor="middle" fill="#D9501F">E</text>
  <!-- 标记：vol.01 -->
  <text x="256" y="445" font-family="JetBrains Mono,monospace" font-size="28" font-weight="700" text-anchor="middle" fill="#FBF7F0" letter-spacing="6">VOL.01</text>
</svg>
